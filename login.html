<!DOCTYPE html>
<html>
<head>
    <title>Blood Bank - Login</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login {
            background: white;
            width: 300px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
            text-align: center;
        }

        h2 {
            color: #c62828;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 97%;
            padding: 10px;
            background: #c62828;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        a {
            display: block;
            margin-top: 15px;
            color: #c62828;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login">
        <h2>Blood Bank</h2>
        <p>Login to your account</p>

        <form>
            <input type="email" placeholder="Enter Email" required>

            <input type="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>
        </form>

        <a href="#">Forgot Password?</a>
        <a href="#">Create New Account</a>
    </div>

</body>
</html>
